name: Build Noka APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Unzip Android project
        run: |
          unzip NokaLiveWallpaper-Android-Project.zip -d extracted
          find extracted -name settings.gradle -print

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Build APK
        run: |
          cd extracted/NokaLiveWallpaper-Android-Project/NokaLiveWallpaper
          gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Noka-APK
          path: extracted/**/app/build/outputs/apk/debug/*.apk
