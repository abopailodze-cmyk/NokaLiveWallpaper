name: Build Noka APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Unzip Android project
        run: |
          unzip NokaLiveWallpaper-Android-Project.zip -d extracted
          find extracted -name settings.gradle -exec dirname {} \; > project_dir.txt
          PROJECT_DIR=$(head -n 1 project_dir.txt)
          echo "PROJECT_DIR=$PROJECT_DIR" >> $GITHUB_ENV

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Build APK
        uses: gradle/gradle-build-action@v3
        with:
          gradle-version: '8.9'
          arguments: assembleDebug
          build-root-directory: ${{ env.PROJECT_DIR }}

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Noka-APK
          path: extracted/**/app/build/outputs/apk/debug/*.apk
